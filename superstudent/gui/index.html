<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Student</title>
<style>
:root {
  --paper: #F5F7FA; --sheet: #FFFFFF; --sunk: #ECEFF4; --ink: #172033; --pencil: #596275; --faint: #8A92A3;
  --rule: #DCE1E8; --blue: #2748C9; --blue-hover: #1D39A6; --blue-soft: #E7ECFC; --on-blue: #FFFFFF;
  --hl: 255, 226, 82; --ok: #1C7A4F; --ok-soft: #E2F3E9; --warn: #8A5200; --warn-soft: #FFF2D4;
  --bad: #B42318; --bad-soft: #FDE8E6;
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --lift: 0 1px 2px rgba(23, 32, 51, .05), 0 6px 20px rgba(23, 32, 51, .06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #13161C; --sheet: #1B1F28; --sunk: #222733; --ink: #E8EBF1; --pencil: #A6AEBE; --faint: #7B8394;
    --rule: #2E3441; --blue: #8DA4FF; --blue-hover: #A8BAFF; --blue-soft: #222B48; --on-blue: #0D1328;
    --ok: #5CCB94; --ok-soft: #16301F; --warn: #F2B75B; --warn-soft: #362A12; --bad: #FF8A7F; --bad-soft: #3B1C1A;
    --lift: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; margin: 0; }
h1 { font-size: 34px; line-height: 1.15; }
h2 { font-size: 23px; line-height: 1.25; }
h3 { font-size: 15px; margin: 0 0 6px; }
p { margin: 0 0 12px; }
a { color: var(--blue); }
[hidden] { display: none !important; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* The highlighter: current step, search matches */
.hl, mark {
  color: #172033; border-radius: 3px; padding: 0 .18em; margin: 0 -.06em;
  background: linear-gradient(100deg, rgba(var(--hl), 0) 0, rgba(var(--hl), .95) 4px, rgba(var(--hl), .7) 45%,
    rgba(var(--hl), .9) calc(100% - 4px), rgba(var(--hl), 0) 100%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}

/* Controls */
.btn {
  font: 600 14px/1.2 var(--sans); border-radius: 8px; padding: 9px 16px; border: 1px solid var(--rule);
  background: var(--sheet); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center;
  gap: 8px; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--blue); padding: 7px 8px; }
.btn.quiet:hover { background: var(--blue-soft); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.destroy { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.destroy:hover { background: var(--bad); filter: brightness(.92); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.big { padding: 12px 22px; font-size: 15px; }
input[type=text], input[type=password], input[type=search], input[type=date], textarea, select {
  font: 15px/1.3 var(--sans); padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--sheet); color: var(--ink); width: 100%; min-width: 0;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
textarea { resize: vertical; line-height: 1.5; }
select { width: auto; padding-right: 30px; }
input[type=checkbox] { accent-color: var(--blue); width: 17px; height: 17px; margin: 0; flex: none; }
input.switch {
  -webkit-appearance: none; appearance: none; width: 42px; height: 25px; border-radius: 13px; background: var(--rule);
  position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0;
}
input.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s;
}
input.switch:checked { background: var(--blue); }
input.switch:checked::after { transform: translateX(17px); }
.field { margin: 22px 0; }
.field > label, .label { display: block; font-weight: 600; margin-bottom: 7px; }
.help { color: var(--pencil); font-size: 13.5px; margin: 7px 0 0; }
.err { color: var(--bad); font-size: 14px; margin: 10px 0 0; min-height: 1px; }
.err:empty { display: none; }
.good { color: var(--ok); font-weight: 600; margin: 10px 0 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--pencil); }
.small { font-size: 13px; }
.spin {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--blue);
  animation: spin .8s linear infinite; flex: none; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* Brand */
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 19px; font-weight: 600; }
.brand svg { flex: none; }

/* Setup: rail + stage */
.wiz { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--sunk); border-right: 1px solid var(--rule); padding: 26px 22px; display: flex; flex-direction: column; }
.steps { list-style: none; margin: 40px 0 0; padding: 0; }
.steps li { display: flex; gap: 12px; align-items: center; padding: 9px 0; color: var(--faint); font-size: 14.5px; }
.steps .num {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; flex: none;
}
.steps li.done { color: var(--pencil); }
.steps li.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.now .num { border-color: var(--ink); }
.rail-foot { margin-top: auto; font-size: 12.5px; color: var(--pencil); line-height: 1.45; }
.stage { padding: 52px 60px 48px; max-width: 760px; width: 100%; }
.stage h1 { margin-bottom: 14px; }
.lede { font-size: 16.5px; color: var(--pencil); max-width: 60ch; }
.nav { display: flex; gap: 10px; margin-top: 32px; align-items: center; }

/* Welcome */
.welcome { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); }
.welcome .intro { padding: 56px 56px 40px 64px; display: flex; flex-direction: column; }
.welcome h1 { font-size: 42px; margin: 44px 0 16px; max-width: 17ch; }
.welcome .lede { margin-bottom: 26px; }
.needs { list-style: none; padding: 0; margin: 0 0 30px; }
.needs li { padding: 5px 0 5px 26px; position: relative; }
.needs li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 11px; height: 2px; background: var(--faint); }
.fine { font-size: 13px; color: var(--pencil); margin-top: 16px; max-width: 52ch; }
.shelf { background: var(--sunk); border-left: 1px solid var(--rule); padding: 56px 44px; display: flex; flex-direction: column; justify-content: center; }
.shelf .cap { color: var(--pencil); font-size: 13.5px; margin-bottom: 14px; }
.tree { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; box-shadow: var(--lift); font-size: 13.5px; }
.tree .node { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 0; }
.tree .node .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .node .why { grid-column: 2; color: var(--pencil); font-size: 12.5px; margin-top: -3px; }
.tree svg { display: block; }

/* Lists of choices */
.choices { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); overflow: hidden; }
.choice { display: flex; gap: 14px; align-items: flex-start; padding: 13px 16px; border-top: 1px solid var(--rule); cursor: pointer; }
.choice:first-child { border-top: 0; }
.choice:hover { background: var(--paper); }
.choice input { margin-top: 3px; }
.choice .t { font-weight: 600; }
.choice .s { color: var(--pencil); font-size: 13.5px; }
.choice.key { background: var(--ok-soft); }
.schools { margin-top: 12px; }
.schools .choice { align-items: center; }

/* Token steps */
.howto { counter-reset: h; list-style: none; padding: 0; margin: 22px 0 0; }
.howto > li { counter-increment: h; position: relative; padding: 0 0 18px 42px; }
.howto > li::before {
  content: counter(h); position: absolute; left: 0; top: -1px; width: 27px; height: 27px; border-radius: 50%;
  background: var(--sheet); border: 1.5px solid var(--rule); display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.howto > li > div { margin-top: 10px; }
.kbd { font-weight: 600; background: var(--sunk); border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.tokenrow { display: flex; gap: 8px; max-width: 520px; }
.aside { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; font-size: 13.5px; color: var(--pencil); margin-top: 8px; }
.aside strong { color: var(--ink); }
details.more { margin-top: 12px; font-size: 14px; }
details.more summary { cursor: pointer; color: var(--blue); font-weight: 600; }
details.more p { color: var(--pencil); margin: 8px 0 0; }

/* AI tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { border: 1.5px solid var(--rule); border-radius: 14px; padding: 18px; background: var(--sheet); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.tile.on { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.tile .head { display: flex; align-items: center; gap: 10px; }
.tile .name { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.tile .maker { color: var(--pencil); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 99px; padding: 2px 9px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: var(--sunk); color: var(--pencil); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Options */
.opt { display: flex; gap: 16px; align-items: flex-start; padding: 18px 0; border-top: 1px solid var(--rule); }
.opt:first-of-type { border-top: 0; }
.opt .txt { flex: 1; }
.opt .t { font-weight: 600; }
.opt .s { color: var(--pencil); font-size: 13.5px; margin-top: 3px; }
.opt .sub { margin-top: 10px; }

/* Checklist */
.checks { list-style: none; padding: 0; margin: 26px 0 0; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--rule); align-items: start; }
.checks li:first-child { border-top: 0; }
.checks .mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.checks .mark.ok { background: var(--ok); color: #fff; }
.checks .mark.no { background: var(--warn-soft); color: var(--warn); font-weight: 800; }
.checks .mark.wait { border: 2px solid var(--rule); }
.checks .d { color: var(--pencil); font-size: 13.5px; overflow-wrap: anywhere; }

/* Ready + guides */
.guide { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 20px 22px; margin-top: 18px; }
.guide h2 { margin-bottom: 8px; }
.guide ol { margin: 10px 0 14px; padding-left: 20px; }
.guide ol li { margin: 6px 0; padding-left: 4px; }
.guide .note { color: var(--pencil); font-size: 13.5px; }
.prompts { list-style: none; padding: 0; margin: 10px 0 0; }
.prompts li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--rule); }
.prompts li:first-child { border-top: 0; }
.prompts .q { flex: 1; font-family: var(--serif); font-size: 15.5px; }

/* Dashboard */
.top { display: flex; align-items: center; gap: 14px; padding: 13px 26px; border-bottom: 1px solid var(--rule); background: var(--sheet); position: sticky; top: 0; z-index: 5; }
.status { display: flex; align-items: center; gap: 9px; color: var(--pencil); font-size: 13.5px; min-width: 0; margin-left: 12px; }
.status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 26px 56px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px 12px 16px; margin-bottom: 10px; }
.banner .txt { flex: 1 1 280px; font-size: 14px; }
.banner.bad { background: var(--bad-soft); }
.searchbar { display: flex; gap: 10px; align-items: center; margin: 6px 0 4px; }
.searchbar input { font-size: 16px; padding: 12px 14px 12px 40px; border-radius: 11px;
  background: var(--sheet) no-repeat 14px 50%; }
.searchbar .field-wrap { position: relative; flex: 1; }
.searchbar .field-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 30px; margin-top: 20px; align-items: start; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 2px; }
.section-head h2 { font-size: 21px; }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 16px; }
.course { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px 12px 12px 12px; padding: 16px 18px 14px; margin-top: 26px; display: flex; flex-direction: column; }
.course .tab {
  position: absolute; top: -24px; left: -1px; height: 24px; max-width: 70%; padding: 0 12px; border-radius: 8px 8px 0 0;
  background: var(--c); color: #172033; font-size: 12.5px; font-weight: 700; display: flex; align-items: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.course::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; background: var(--c); border-radius: 0 0 0 12px; }
.course .name { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.25; }
.course .term { color: var(--pencil); font-size: 13px; margin-top: 2px; }
.course .next { margin-top: 12px; font-size: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; }
.course .next .k { font-weight: 700; }
.course .next .w { grid-column: 2; color: var(--pencil); font-size: 13px; }
.course .counts { margin-top: 10px; color: var(--pencil); font-size: 13px; }
.course .counts .wait { color: var(--warn); }
.course .acts { display: flex; gap: 6px; margin-top: 12px; margin-left: -8px; flex-wrap: wrap; }
.empty { background: var(--sheet); border: 1px dashed var(--rule); border-radius: 12px; padding: 26px; margin-top: 14px; }
.side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; }
.panel h2 { font-size: 18px; margin-bottom: 8px; }
.ai { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--rule); }
.ai:first-of-type { border-top: 0; }
.ai .n { font-weight: 600; }
.results { margin-top: 10px; }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ok); border-radius: 4px; min-width: 2px; }
.hit { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
.hit .h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hit .title { font-family: var(--serif); font-size: 16.5px; font-weight: 600; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; }
.hit .title:hover { color: var(--blue); text-decoration: underline; }
.hit .loc { color: var(--pencil); font-size: 13px; }
.hit .snip { margin: 7px 0 4px; font-size: 14px; line-height: 1.55; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 5px; background: var(--c); color: #172033; }

/* Sheets (dialogs) */
.scrim { position: fixed; inset: 0; background: rgba(15, 20, 32, .38); display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; overflow-y: auto; z-index: 50; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--sheet); border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .28); width: 100%; max-width: 560px; animation: drop .16s ease-out; }
.sheet.wide { max-width: 700px; }
@keyframes drop { from { transform: translateY(-10px); opacity: .4; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 20px 22px 6px; }
.sheet-head h2 { flex: 1; font-size: 22px; }
.sheet-body { padding: 8px 22px 22px; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.setgroup { padding: 18px 0; border-top: 1px solid var(--rule); }
.setgroup:first-child { border-top: 0; padding-top: 6px; }
.setgroup > h3 { font-size: 16px; font-family: var(--serif); margin-bottom: 10px; }
.setrow { display: flex; align-items: center; gap: 14px; padding: 7px 0; }
.setrow .txt { flex: 1; }
.setrow .s { color: var(--pencil); font-size: 13px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
.radio input { accent-color: var(--blue); margin-top: 4px; }
.lines { font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: var(--sunk); border-radius: 10px; padding: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.list { margin: 0; padding-left: 18px; max-height: 340px; overflow: auto; }
.list li { margin: 4px 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #172033; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 80; max-width: min(560px, 90vw); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.bad { background: #8F1C12; }
.loading { min-height: 100vh; display: grid; place-items: center; color: var(--pencil); }

@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .side { position: static; }
}
@media (max-width: 760px) {
  .wiz, .welcome { grid-template-columns: 1fr; }
  .rail { flex-direction: row; align-items: center; padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .steps, .rail-foot { display: none; }
  .stage, .welcome .intro { padding: 28px 16px; }
  .welcome h1 { margin-top: 28px; font-size: 34px; }
  .shelf { border-left: 0; border-top: 1px solid var(--rule); padding: 28px 16px; }
  .tiles { grid-template-columns: 1fr; }
  .top { padding: 10px 16px; flex-wrap: wrap; }
  .status { order: 5; width: 100%; margin-left: 0; }
  .wrap { padding: 16px 16px 40px; }
  .searchbar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div id="app"><div class="loading">Opening Super Student…</div></div>
<div id="modals"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const TOKEN = "__SS_TOKEN__";
const NATIVE = "__SS_NATIVE__" === "true";

/* ------------------------------------------------------------------ basics */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
function svg(markup) { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; }

async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", headers: { "X-SS-Token": TOKEN } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  try {
    const r = await fetch(path, opts);
    return await r.json();
  } catch (e) {
    return { ok: false, message: "Super Student stopped responding. Close this window and open the app again." };
  }
}

let toastTimer = null;
function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast" + (bad ? " bad" : ""); }, bad ? 6000 : 3200);
}

async function copyText(text) {
  let done = false;
  try { await navigator.clipboard.writeText(text); done = true; } catch (e) { /* fall back below */ }
  if (!done) {
    const ta = el("textarea", { style: "position:fixed;top:0;left:0;opacity:0" });
    ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    ta.remove();
  }
  toast("Copied. Paste it into ChatGPT or Claude.");
}

function openUrl(url) { return api("/api/open-url", { url }).then(r => { if (!r.ok) toast(r.message || "Couldn't open that link.", true); }); }
function openPlace(which, folder) { return api("/api/open-place", { which, folder: folder || "" }).then(r => { if (!r.ok) toast(r.message || "Couldn't open that.", true); }); }

const TAB_COLORS = ["#8FB3F0", "#86CFA8", "#F2A594", "#BBA6EE", "#F2C877", "#78C9CE", "#EFA6CA", "#BFCB75"];
function courseColor(key) {
  let h = 0;
  for (const ch of String(key || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return TAB_COLORS[h % TAB_COLORS.length];
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
function friendlyPath(p) {
  if (!S) return p;
  const home = S.library.home;
  if (p === home + "/SuperStudent") return "SuperStudent, in your home folder";
  return p.startsWith(home + "/") ? "~" + p.slice(home.length) : p;
}
function snippetNodes(text) {
  // The app marks matches with \u0002 ... \u0003; show them highlighted, everything else as plain text.
  return String(text || "").split(/[\u0002\u0003]/).map((part, i) => i % 2 ? el("mark", null, part) : part);
}

async function boot() {
  await refreshState();
  if (!S) {
    document.getElementById("app").replaceChildren(el("div", { class: "loading" }, "Super Student didn't start properly. Close this window and open the app again."));
    return;
  }
  if (!NATIVE) { api("/api/ping", {}); setInterval(() => api("/api/ping", {}), 10000); }
  if (S.setup_complete) { view = "dashboard"; }
  else {
    W.url = S.canvas.url; W.host = S.canvas.host; W.user = S.canvas.user;
    W.excluded = new Set(S.settings.excluded);
    W.ai = { openai: S.assistants.openai.app_installed || S.assistants.openai.status !== "off",
             claude: S.assistants.claude.app_installed || S.assistants.claude.status !== "off" };
    W.interval = S.settings.interval; W.transcribe = S.settings.transcribe; W.library = S.library.path;
    W.step = !S.canvas.url ? "welcome" : (!S.canvas.token_saved || S.canvas.rejected) ? "token" : "courses";
    view = "wizard";
  }
  render();
  setInterval(async () => {
    if (view !== "dashboard" || document.hidden) return;
    await refreshState();
    if (S.sync.running) ensurePolling();
    renderDashParts();
  }, 45000);
}

function render() {
  const app = document.getElementById("app");
  if (view === "wizard") app.replaceChildren(renderWizard());
  else if (view === "dashboard") { app.replaceChildren(renderDashboard()); renderDashParts(); if (S.sync.running) ensurePolling(); }
  window.scrollTo(0, 0);
}

function tokenPanel(opts) {
  // Used by setup and by "Reconnect Canvas". The token only ever lives in this field until it's sent to
  // the app, which checks it with Canvas and saves it in the Keychain.
  const host = opts.host, base = opts.url;
  const field = el("input", { type: "password", id: "tok", autocomplete: "off", spellcheck: "false", autocapitalize: "off", placeholder: "Paste the token here", "aria-label": "Canvas access token" });
  const show = el("button", { class: "btn small", type: "button", onclick: () => { field.type = field.type === "password" ? "text" : "password"; show.textContent = field.type === "password" ? "Show" : "Hide"; } }, "Show");
  const err = el("p", { class: "err", role: "alert" });
  const good = el("p", { class: "good", role: "status", hidden: true });
  const btn = el("button", { class: "btn primary", onclick: connect }, "Connect");
  async function connect() {
    const value = field.value.trim();
    if (!value) { err.textContent = "Paste the token from Canvas first."; field.focus(); return; }
    btn.disabled = true; btn.textContent = "Checking with Canvas…"; err.textContent = "";
    const r = await api("/api/canvas/connect", { url: base, token: value });
    btn.disabled = false; btn.textContent = "Connect";
    if (!r.ok) { err.textContent = r.message; field.focus(); field.select(); return; }
    field.value = ""; field.disabled = true; btn.disabled = true;
    good.hidden = false; good.textContent = r.name ? "Connected as " + r.name + "." : "Connected.";
    setTimeout(() => opts.onConnected(r), 900);
  }
  field.addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
  setTimeout(() => field.focus(), 60);
  return el("div", null,
    el("p", { class: "aside" }, "Personal use only while Canvas integration approval is unresolved. Connect only your own account. Onboarding other users requires approved OAuth access and integration approval."),
    el("ol", { class: "howto" },

      el("li", null, "Copy the long code Canvas shows you. Canvas only shows it once, so copy it before closing that window."),
      el("li", null, "Paste it here and click Connect.",
        el("div", { class: "tokenrow" }, field, show), err, good)),
    el("div", { class: "aside" },
      el("strong", null, "Why a token? "),
      "It lets Super Student read your courses as you, without knowing your password. It's saved in your Mac's Keychain and only sent to " + host + ". It's for your own account and your own studying, so don't share it. To cut off access at any time, delete it in the same Canvas settings page."),
    el("details", { class: "more" },

    el("div", { class: "nav" }, opts.back ? el("button", { class: "btn", onclick: opts.back }, "Back") : null, el("span", { class: "spacer" }), btn));
}

  const hint = el("p", { class: "help", hidden: true }, "The first copy can take a while, mostly for lecture recordings. It keeps going even if you close this window, and your AI can start using courses as they arrive.");
  const planned = [{ id: "settings", label: "Save your settings" }];
  if (W.ai.openai) planned.push({ id: "openai", label: "Connect ChatGPT" });
  if (W.ai.claude) planned.push({ id: "claude", label: "Connect Claude" });

  if (W.transcribe && !S.transcription.available) planned.push({ id: "speech", label: "Add the part that turns recordings into text" });

    }));

    if (!r.ok) { W.setupStarted = false; list.append(el("li", null, el("span"), el("p", { class: "err" }, r.message || "Setup didn't finish."))); return; }

    el("p", { class: "lede" }, "This takes a moment. Then Super Student starts copying your courses."),

  renderLeft();

async function startSync(course) {
  localAttention = [];
  const r = await api("/api/sync/start", { course: course || "" });
  if (!r.ok) { toast(r.message || "Couldn't start the update.", true); return; }
  toast(r.message || "Update started.");
  PROG = { running: true, phase: "Starting" };
  ensurePolling();
  renderDashParts();
}

function ensurePolling(onTick) {
  if (onTick) ensurePolling.onTick = onTick;
  if (pollTimer) return;
  const tick = async () => {
    const p = await api("/api/sync/progress");
    if (!p || p.running === undefined) return;
    PROG = p;
    if (ensurePolling.onTick && view === "wizard") ensurePolling.onTick();
    if (p.running) {
      if (view === "dashboard") { if (Date.now() - lastStateAt > 8000) await refreshState(); renderStatus(); if (!S.courses.length || Date.now() - lastStateAt < 1000) renderDashParts(); }
      return;
    }
    clearInterval(pollTimer); pollTimer = null;
    await refreshState();
    if (view === "dashboard") {
      if (p.ours && p.failed && !p.auth_error) localAttention = [{ kind: "error", action: "details", text: "The last update stopped early. It tries again on the next update.", details: p.lines }];
      if (p.ours) toast(p.auth_error ? "Canvas didn't accept the saved access token." : p.failed ? "The update stopped early." : "Your courses are up to date.", p.failed || p.auth_error);
      renderDashParts();
    }
  };
  pollTimer = setInterval(tick, 2000);
  tick();

function sheet(title, build, opts) {
  opts = opts || {};
  const root = document.getElementById("modals");
  const prev = document.activeElement;
  const id = "s" + Math.random().toString(36).slice(2);
  let scrim;
  const close = () => {
    scrim.remove(); document.removeEventListener("keydown", onKey);
    if (root.lastElementChild) root.lastElementChild.inert = false;
    else document.getElementById("app").inert = false;
    if (prev && prev.isConnected && prev.focus) prev.focus();
    else if (root.lastElementChild) root.lastElementChild.querySelector("h2").focus();
    if (opts.onClose) opts.onClose();
  };
  const onKey = e => {
    if (root.lastElementChild !== scrim) return;
    if (e.key === "Escape") { close(); return; }
    if (e.key !== "Tab") return;
    const focusable = [...scrim.querySelectorAll("button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), summary, [tabindex='0']")].filter(n => !n.hidden && n.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (!first) { e.preventDefault(); return; }
    if (e.shiftKey && (document.activeElement === first || !focusable.includes(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !focusable.includes(document.activeElement))) { e.preventDefault(); first.focus(); }
  };
  const box = el("div", { class: "sheet" + (opts.wide ? " wide" : ""), role: "dialog", "aria-modal": "true", "aria-labelledby": id },
    el("div", { class: "sheet-head" }, el("h2", { id, tabindex: "-1" }, title), el("button", { class: "btn quiet close", "aria-label": "Close", onclick: () => close() }, "Close")),
    el("div", { class: "sheet-body" }, build(close)));
  scrim = el("div", { class: "scrim", onmousedown: e => { if (e.target === scrim) close(); } }, box);
  document.getElementById("app").inert = true;
  if (root.lastElementChild) root.lastElementChild.inert = true;
  root.append(scrim);
  document.addEventListener("keydown", onKey);
  setTimeout(() => { const f = box.querySelector(".sheet-body input[type=password], .sheet-body input[type=text]"); (f || box.querySelector("h2")).focus(); }, 40);
  return close;
}

        el("p", { class: "help" }, "Answer key or question looks wrong? ", el("button", { class: "btn quiet small", onclick: () => confirmAction("Remove this question?", "Its practice history is removed with it.", "Remove question", async () => {
          const removed = await api("/api/exam/remove-questions", { plan_id: planId, question_ids: [q.id] });

    el("ol", { class: "howto" },
      el("li", null, "Delete the access token in Canvas, so nothing can use it.",
        (r.canvas_url || (S && S.canvas.url)) ? el("div", null, el("button", { class: "btn", onclick: () => openUrl(settingsUrl) }, "Open Canvas settings")) : null),
      el("li", null, "Close this window, then drag the Super Student app from Applications to the Trash.")),
    el("div", { class: "nav" }, el("button", { class: "btn primary", onclick: () => api("/api/quit", {}).then(() => { document.getElementById("app").replaceChildren(el("div", { class: "loading" }, "You can close this window.")); }) }, "Close Super Student"))));
}

function openSettings() {
  sheet("Settings", closeSettings => {
    const save = async (body, msg) => {
      const r = await api("/api/settings", body);
      if (!r.ok) { toast(r.message || "Couldn't save that.", true); return; }
      await refreshState(); renderDashParts();
      if (r.problem) toast("Saved, but automatic updates couldn't be turned on: " + r.message, true);
      else if (r.message && r.message.startsWith("Saved:")) toast(r.message);
      else toast(msg || "Saved.");
    };
    const st = S.settings;

    // Canvas
    const canvas = el("div", { class: "setgroup" }, el("h3", null, "Canvas"),
      el("div", { class: "setrow" }, el("div", { class: "txt" },
          el("div", null, S.canvas.token_saved ? "Connected to " + S.canvas.host : S.canvas.host ? "Not connected to " + S.canvas.host : "Not connected"),
          S.canvas.user ? el("div", { class: "s" }, "As " + S.canvas.user) : null),
        el("button", { class: "btn small", onclick: openReconnect }, S.canvas.token_saved ? "Reconnect" : "Connect"),
        S.canvas.token_saved ? el("button", { class: "btn small danger", onclick: () => confirmSheet("Sign out of Canvas?", "Super Student stops updating your courses until you connect again. Your SuperStudent folder stays as it is.", "Sign out", async () => { await api("/api/signout", {}); closeSettings(); await refreshState(); renderDashParts(); toast("Signed out of Canvas."); }) }, "Sign out") : null));

    // Courses
    const courseBox = el("div");
    const loadCourses = async () => {
      courseBox.replaceChildren(el("p", { class: "row muted small" }, el("span", { class: "spin" }), "Getting your courses from Canvas…"));
      const r = await api("/api/canvas/courses");
      if (!r.ok) { courseBox.replaceChildren(el("p", { class: "err" }, r.message)); return; }
      const excluded = new Set(r.courses.filter(c => !c.included).map(c => c.id));
      courseBox.replaceChildren(el("div", { class: "choices" }, r.courses.map(c => {
        const cb = el("input", { type: "checkbox", checked: c.included });
        cb.addEventListener("change", () => { cb.checked ? excluded.delete(c.id) : excluded.add(c.id); save({ excluded: [...excluded] }, cb.checked ? "Added. It's copied on the next update." : "Removed. Files already copied stay in your folder."); });
        return el("label", { class: "choice" }, cb, el("div", null, el("div", { class: "t" }, c.name), el("div", { class: "s" }, [c.code, c.term].filter(Boolean).join(", "))));
      })));
    };
    const courses = el("div", { class: "setgroup" }, el("h3", null, "Courses"),
      el("p", { class: "muted small" }, "All the courses you're in right now are copied, except ones you untick."), courseBox);
    if (S.canvas.token_saved) loadCourses(); else courseBox.append(el("p", { class: "muted small" }, "Connect Canvas to choose courses."));

    // Updates
    const auto = el("input", { type: "checkbox", class: "switch", role: "switch", checked: st.auto_sync, "aria-label": "Update automatically" });
    const every = el("select", { "aria-label": "How often", disabled: !st.auto_sync }, st.intervals.map(h => el("option", { value: h, selected: h === st.interval }, "Every " + h + " hours")));
    auto.addEventListener("change", () => { every.disabled = !auto.checked; save({ auto_sync: auto.checked, interval: parseInt(every.value, 10) }, auto.checked ? "Automatic updates are on." : "Automatic updates are off."); });
    every.addEventListener("change", () => save({ auto_sync: true, interval: parseInt(every.value, 10) }));
    const updates = el("div", { class: "setgroup" }, el("h3", null, "Updates"),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Update automatically"), el("div", { class: "s" }, "While your Mac is on")), every, auto));

    // Recordings
    const tr = el("input", { type: "checkbox", class: "switch", role: "switch", checked: st.transcribe, "aria-label": "Turn recordings into text" });
    tr.addEventListener("change", () => save({ transcribe: tr.checked }));
    const radio = (value, label, sub) => {
      const r = el("input", { type: "radio", name: "acc", value, checked: st.accuracy === value });
      r.addEventListener("change", () => { if (r.checked) save({ accuracy: value }, "Saved. New recordings use this."); });
      return el("label", { class: "radio" }, r, el("div", null, el("div", null, label), el("div", { class: "s muted small" }, sub)));
    };
    const keep = el("input", { type: "checkbox", class: "switch", role: "switch", checked: st.keep_videos, "aria-label": "Keep the video files" });
    keep.addEventListener("change", () => save({ keep_videos: keep.checked }));
    const rec = el("div", { class: "setgroup" }, el("h3", null, "Lecture recordings"),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Turn recordings into text"),
        el("div", { class: "s" }, S.transcription.available ? "Runs privately on this Mac." : "The part that does this isn't installed yet.")),
        S.transcription.available ? null : el("button", { class: "btn small", onclick: async e => { e.target.disabled = true; const r = await api("/api/install-transcription", {}); toast(r.message); } }, "Install"), tr),
      radio("standard", "Standard", "Faster. Good for most lectures."),
      radio("higher", "Higher accuracy", "Slower, and a bigger one-time download. Better with accents and technical terms."),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Keep the video files"), el("div", { class: "s" }, "Uses a lot of space. Off means only the text is kept.")), keep));

    // AI apps
    const ai = el("div", { class: "setgroup" }, el("h3", null, "AI apps"), ["openai", "claude"].map(key => {
      const a = S.assistants[key];
      return el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, APPS[key].name),
          el("div", { class: "s" }, a.status === "connected" ? "Connected" : a.status === "partial" ? "Partly connected" : "Not connected")),
        el("button", { class: "btn quiet small", onclick: () => openGuide(key) }, "How to use"),
        el("button", { class: "btn small", onclick: () => connectAssistant(key) }, a.status === "connected" ? "Reconnect" : "Connect"));
    }));

    // Folder + extras + about
    const folder = el("div", { class: "setgroup" }, el("h3", null, "Your folder"),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, friendlyPath(S.library.path))),
        el("button", { class: "btn small", onclick: () => openPlace("library") }, "Show in Finder")));
    const extras = el("div", { class: "setgroup" }, el("h3", null, "Extras"),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "LibreOffice"),
          el("div", { class: "s" }, "Opens older .ppt and .doc files and can turn exam packs into PDFs. Free.")),
        S.extras.libreoffice ? el("span", { class: "pill ok" }, "Installed") : el("button", { class: "btn small", onclick: () => openUrl("https://www.libreoffice.org/download/download-libreoffice/") }, "Get LibreOffice")),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Reading text in pictures"),
          el("div", { class: "s" }, S.extras.ocr ? "Labels in diagrams, scanned pages and lecture screens are read with " + S.extras.ocr_label + "."
            : "Pictures are kept for your AI to look at, but the words in them aren't searchable on this computer.")),
        S.extras.ocr ? el("span", { class: "pill ok" }, "On") : el("span", { class: "pill off" }, "Not available")));
    const about = el("div", { class: "setgroup" }, el("h3", null, "About"),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Super Student " + S.version), el("div", { class: "s" }, "Reads from Canvas only. Never submits, posts or edits anything. (Like opening a page in your browser, reading one can mark it viewed in a module.)")),
        el("button", { class: "btn quiet small", onclick: () => openPlace("logs") }, "Open logs")),
      el("div", { class: "setrow" }, el("div", { class: "txt" }, el("div", null, "Remove Super Student"),
          el("div", { class: "s" }, "Turns off updates and disconnects ChatGPT and Claude. Your courses folder stays unless you choose otherwise.")),
        el("button", { class: "btn small danger", onclick: () => { closeSettings(); openUninstall(); } }, "Uninstall…")));
    return [canvas, courses, updates, rec, ai, folder, extras, about];
  }, { wide: true });
}

boot();
</script>
</body>
</html>
